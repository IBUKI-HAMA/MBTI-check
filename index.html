<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>自治体DXタイプ診断</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Yu Gothic","Segoe UI",sans-serif;
    background:#07121f;
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px;
    display:grid;
    grid-template-columns:450px 1fr;
    gap:40px;
    min-height:100vh;
    align-items:center;
}

.form-card{
    background:white;
    color:#1B3A5C;
    padding:40px;
    border-radius:24px;
}

.form-card h2{
    margin-top:0;
    color:#1B3A5C;
}

.form-card p{
    color:#607080;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d6dbe2;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:30px;
    padding:16px;
    background:#1B3A5C;
    color:white;
    border:none;
    border-radius:14px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#23486d;
}

button:disabled,
button:disabled:hover{
    background:#9aa4af;
    cursor:not-allowed;
    opacity:0.8;
}

.side{
    text-align:center;
}

.side h1{
    font-size:52px;
    line-height:1.2;
    margin-bottom:20px;
}

.side p{
    color:#8FBCCC;
    font-size:20px;
    line-height:1.8;
}

.result{
    margin-top:30px;
    background:#0c1f36;
    color:white;
    border-radius:16px;
    padding:30px;
    display:none;
}

.result h3{
    color:#8FBCCC;
}

#type{
    color:white;
    font-size:34px;
    margin-top:0;
}

#solution{
    color:white;
}

.error{
    color:#ff4d4f;
    margin-top:20px;
}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.side{
    order:-1;
}

.side h1{
    font-size:36px;
}

}

</style>
</head>

<body>

<div class="container">

    <div class="side">

        <h1>自治体DX<br>タイプ診断</h1>

        <p>
            あなたの自治体に最適な<br>
