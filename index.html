<body>
<div class="container">
<div class="side">
<h1>自治体DX<br>タイプ診断</h1>
<p>
あなたの自治体に最適な<br>
DX推進戦略を診断します
</p>
</div>
<div class="form-card">
<h2>基本情報の入力</h2>

<p>
ご回答時に入力した自治体名・部署名・お名前を入力してください
</p>

<label>１．自治体名</label>

<input id="city" placeholder="例）○○市">

 

<label>２．部署名</label>

<input id="dept" placeholder="例）DX推進課">

 

<label>３．お名前</label>

<input id="name" placeholder="例）内田 太郎">
<button id="searchBtn" onclick="searchResult()">診断結果を表示</button>
<div id="error" class="error"></div>
<div id="result" class="result">
<h3>あなたの診断結果</h3>
<h2 id="type"></h2>
<h3>おすすめのソリューション</h3>

<p id="solution"></p>

</div>
</div>

</div>
<script>

async function searchResult(){
const btn = document.getElementById("searchBtn");
btn.disabled = true;
btn.innerHTML = "診断結果を取得中...";

const city = document.getElementById("city").value.trim();
const dept = document.getElementById("dept").value.trim();
const name = document.getElementById("name").value.trim();

if(!city || !dept || !name){
document.getElementById("result").style.display = "none";
document.getElementById("error").innerHTML =
"自治体名・部署名・氏名をすべて入力してください";
btn.disabled = false;
btn.innerHTML = "診断結果を表示";
return;
}
 
const url =
"https:" +
"//default045dc47ad5a1414fa0077cdb1e3f3d.e7.environment.api.powerplatform.com" +
"/powerautomate/automations/direct/cu/23/workflows/2701d707cca449a684f31539bdcc4840" +
"/triggers/manual/paths/invoke" +
"?api-version=1" +
"&sp=%2Ftriggers%2Fmanual%2Frun" +
"&sv=1.0" +
"&sig=f9avoHBUVmSXAincmVXI56XUTuN4Et6qFVy0FrF86ps";

try{
const response = await fetch(url,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
    
body:JSON.stringify({
city:city,
dept:dept,
name:name
})
});

const result = await response.json();
document.getElementById("error").innerHTML = "";
document.getElementById("type").innerHTML =
result.type;
document.getElementById("solution").innerHTML =
result.solution
.split("、")
.map(function(x){
return "✅ " + x;
})
    
.join("<br>");
document.getElementById("result").style.display =
"block";
btn.disabled = true;
btn.innerHTML = "診断結果を表示";
}

catch(error){
document.getElementById("result").style.display =
"none";
document.getElementById("error").innerHTML =
"通信エラーが発生しました";
btn.disabled = false;
btn.innerHTML = "診断結果を表示";
console.error(error);
}
}

</script>
